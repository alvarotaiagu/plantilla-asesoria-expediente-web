<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Special+Elite&display=swap');
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; }
  body{
    background:#E8DFC8; font-family:'Source Serif 4', serif; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .marco{
    width:1080px; height:510px; background:#FBF8F1; border:2px solid #C9BC9E; border-radius:18px;
    box-shadow:0 30px 60px -20px rgba(43,36,28,.35); position:relative; padding:64px 72px; display:flex; flex-direction:column; justify-content:center;
  }
  .pestanas{ position:absolute; top:-34px; left:72px; display:flex; gap:10px; }
  .pestanas div{ width:118px; height:52px; border-radius:10px 10px 0 0; }
  .pestanas div:nth-child(1){ background:#33473C; }
  .pestanas div:nth-child(2){ background:#5C6B72; }
  .pestanas div:nth-child(3){ background:#9C5A42; }
  .pestanas div:nth-child(4){ background:#5C3A4E; }
  .rotulo{ font-family:'Special Elite', monospace; font-size:20px; letter-spacing:.1em; text-transform:uppercase; color:#5F574B; margin-bottom:22px; }
  h1{ font-size:58px; font-weight:700; color:#2B241C; line-height:1.12; max-width:820px; }
  .pie{ margin-top:34px; font-family:'Special Elite', monospace; font-size:19px; color:#5F574B; letter-spacing:.03em; }
  .marca{ position:absolute; bottom:40px; right:64px; font-family:'Special Elite', monospace; font-size:20px; color:#2B241C; text-align:right; }
</style>
</head>
<body>
  <div class="marco">
    <div class="pestanas"><div></div><div></div><div></div><div></div></div>
    <p class="rotulo">Asesoría · Cambre · A Coruña</p>
    <h1>No amontonamos papeles: los archivamos por color</h1>
    <p class="pie">Fiscal · Laboral · Contable · Sociedades</p>
    <p class="marca">LOMBO CONSULTORES<br>sitio de demostración</p>
  </div>
</body>
</html>
